[pytest]
# Register marks (stops PytestUnknownMarkWarning). Per-test timeouts need pytest-timeout.
markers =
    timeout: Max wall-clock seconds for this test (enforced by pytest-timeout).
    production: Heavy production-readiness / soak tests; exclude in quick CI via -m "not production" (entire tests/test_production_readiness.py is marked production).
    asyncio: Async test (pytest-asyncio).
    csv_contract: CSV mode contract tests; primary entrypoint is scripts/run_csv_contract_release_tests.py (file list), not a blanket mark on all tests.
    benchmark: Performance benchmark tests (can be slow); exclude in quick CI via -m "not benchmark".

# Windows + async: thread-based timeout is more reliable than signal (pytest-timeout docs).
timeout_method = thread

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    --basetemp=artifacts/pytest_tmp
