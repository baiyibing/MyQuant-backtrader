name: turnover-resist-rust

on:
  pull_request:
    paths:
      - "turnover-resist/**"
      - "scripts/verify_rust_python_alignment.py"
      - "docs/backtest/chip/turnover_resistance_rust.md"
      - ".github/workflows/turnover-resist-rust.yml"
  push:
    paths:
      - "turnover-resist/**"
      - "scripts/verify_rust_python_alignment.py"
      - ".github/workflows/turnover-resist-rust.yml"
  workflow_dispatch:

jobs:
  rust-checks:
    runs-on: windows-latest
    env:
      # Local .cargo/config.toml may set rustc-wrapper=sccache; disable in CI runner.
      RUSTC_WRAPPER: ""
    defaults:
      run:
        working-directory: turnover-resist
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt check
        run: cargo fmt --check

      - name: Cargo clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --all-targets
