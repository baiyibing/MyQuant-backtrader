name: python-tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest-and-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      OSKH_DATA_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Contract gates
        run: |
          python scripts/gates/verify_oskh_data_contract.py
          python scripts/gates/verify_data_path_ssot.py

      # requirements.txt includes numba>=0.60 so scan_held_day numba/Python
      # parity (tests/test_scan_held_day_numba_parity.py) runs in CI instead of
      # skipif(not _NUMBA_SCAN_AVAILABLE). Simulate/scan_held_day default remains
      # the Python reference; numba is opt-in only.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Assert numba importable (parity must not silent-skip)
        run: python -c "import numba; print('numba', numba.__version__)"

      - name: Pytest (exclude production / benchmark)
        run: python -m pytest -q -m "not production and not benchmark"
