name: python-tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: python-tests-${{ github.ref }}
  # Full independent-run grouping for master pushes is a future ticket.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest-and-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 3.0.6 = requirements.txt minimum / recorded golden environment;
        # latest = newest pandas allowed by constraints-ci.txt (>=3.0.6).
        pandas: ["3.0.6", "latest"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      OSKH_DATA_ROOT: ${{ github.workspace }}
      BT_REQUIRE_SYMLINK_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Private dependency wheels must not enter shared Actions caches.

      # L0: data-free path/contract gates (pre-pip; H10 Theme E + H12 TR bridge).
      # Do NOT add lake-backed chip/TR/L2 gates here — they fail without F:\stock_data.
      # Inventory: docs/backtest/plan-h10-ci-path-gates-2026-09-15.md
      #            docs/backtest/plan-h12-ci-tr-bridge-gate-2026-09-15.md
      - name: Contract gates
        run: |
          python scripts/gates/verify_oskh_data_contract.py
          python scripts/gates/verify_data_path_ssot.py
          python scripts/gates/verify_no_hardcoded_machine_paths.py
          python scripts/gates/verify_tr_bridge_import_ssot.py
          python scripts/gates/verify_infra_consumer_boundary.py
          python scripts/gates/verify_ops_consumer_boundary.py
          python scripts/gates/verify_factor_consumer_boundary.py
          python scripts/gates/verify_corp_actions_economics_fence.py
          python scripts/gates/verify_no_host_duckdb_connect_outside_allowlist.py

      # requirements.txt includes numba>=0.60 so scan_held_day numba/Python
      # parity (tests/test_scan_held_day_numba_parity.py) runs in CI instead of
      # skipif(not _NUMBA_SCAN_AVAILABLE). Simulate/scan_held_day default remains
      # the Python reference; numba is opt-in only.
      - name: Install dependencies
        env:
          MYQUANT_INFRA_READ_TOKEN: ${{ secrets.MYQUANT_INFRA_READ_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
          PIP_NO_CACHE_DIR: "1"
          PANDAS_LEG: ${{ matrix.pandas }}
        run: |
          if [[ -z "${MYQUANT_INFRA_READ_TOKEN:-}" ]]; then
            echo "::error::Configure MYQUANT_INFRA_READ_TOKEN with Contents: read access to baiyibing/MyQuant-infra."
            exit 1
          fi
          askpass=$(mktemp "$RUNNER_TEMP/infra-askpass.XXXXXX")
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$MYQUANT_INFRA_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          leg_constraints=()
          if [[ "$PANDAS_LEG" != "latest" ]]; then
            printf 'pandas==%s\n' "$PANDAS_LEG" > "$RUNNER_TEMP/pandas-leg.txt"
            leg_constraints=(-c "$RUNNER_TEMP/pandas-leg.txt")
          fi
          GIT_ASKPASS="$askpass" python -m pip install -r requirements.txt -c constraints-ci.txt "${leg_constraints[@]}"
          # scripts/_script_bootstrap.resolve_oskh_python() exits at import when no
          # canonical vanna312 interpreter exists (GitHub-hosted runners). Point the
          # resolver at this job's interpreter so TR backfill subprocesses match pytest.
          echo "OSKH_MERGE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      # L1: registry/baseline/capability admission + minute classification (post-pip).
      # Registry/baseline imports require the installed research dependencies.
      - name: Contract gates (book admission)
        run: python scripts/gates/verify_book_admission.py

      - name: Contract gates (baseline admission)
        run: python scripts/gates/verify_baseline_admission.py

      - name: Contract gates (book capability classification)
        run: python scripts/gates/verify_book_capability_classification.py

      - name: Minute classification gate
        run: python scripts/check_minute_classification.py

      # L2: pandas minimum + ruff bt_contract and RB-10 typing leaf + numba importable.
      - name: Assert pandas version (minimum)
        env:
          PANDAS_LEG: ${{ matrix.pandas }}
        run: |
          if [[ "$PANDAS_LEG" != "latest" ]]; then python -c "import os, pandas; assert pandas.__version__ == os.environ['PANDAS_LEG'], pandas.__version__"; fi
          python -c "import pandas; from packaging.version import Version; print('pandas', pandas.__version__); assert Version(pandas.__version__) >= Version('3.0.6'), pandas.__version__"

      - name: Lint contract package
        run: |
          python -m pip install ruff
          python -m ruff check bt_contract backtest/research/strategy_hooks_types.py

      - name: Assert numba importable (parity must not silent-skip)
        run: python -c "import numba; print('numba', numba.__version__)"

      # L3: required pytest suite; MC-6 marker SSOT shared with pre-push.
      - name: Pytest (exclude production / benchmark)
        run: |
          marker=$(tr -d '\r' < scripts/ci_pytest_marker.txt | sed 's/[[:space:]]*$//')
          python -m pytest -p no:cacheprovider -q -m "$marker"
